name: Build figures (bias simulator)

on:
  workflow_dispatch: {}   # you can click "Run workflow"
  push:
    paths:
      - "bias_simulator/**.py"
      - ".github/workflows/build-figures.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib

      - name: Generate TND/TTE heatmaps
        run: |
          python bias_simulator/make_plots.py

      - name: Generate misclassification sweeps
        run: |
          python bias_simulator/misclass_plots.py

      - name: Commit figures
        uses: EndBug/add-and-commit@v9
        with:
          add: "figures/*"
          message: "chore: update figures (auto)"
