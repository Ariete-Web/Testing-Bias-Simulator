name: Build figures (bias simulator)

on:
  workflow_dispatch: {}   # you can click "Run workflow"
  push:
    paths:
      - "bias_simulator/**.py"
      - ".github/workflows/build-figures.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure matplotlib backend
        run: |
          echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Create figures directory
        run: |
          mkdir -p figures

      - name: Generate TND/TTE heatmaps
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          echo "Generating TND/TTE heatmaps..."
          python bias_simulator/make_plots.py
          echo "Heatmaps generated successfully"
          ls -la figures/

      - name: Generate misclassification sweeps
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          echo "Generating misclassification sweeps..."
          python bias_simulator/misclass_plots.py
          echo "Misclassification sweeps generated successfully"
          ls -la figures/

      - name: Verify generated files
        run: |
          echo "Verifying generated files..."
          test -f figures/bias_heatmap_TND.png || { echo "Error: bias_heatmap_TND.png not found"; exit 1; }
          test -f figures/bias_heatmap_TTE.png || { echo "Error: bias_heatmap_TTE.png not found"; exit 1; }
          test -f figures/bias_sweep_results.csv || { echo "Error: bias_sweep_results.csv not found"; exit 1; }
          test -f figures/misclass_sweep_sens.png || { echo "Error: misclass_sweep_sens.png not found"; exit 1; }
          test -f figures/misclass_sweep_spec.png || { echo "Error: misclass_sweep_spec.png not found"; exit 1; }
          echo "All required files generated successfully!"

      - name: Commit figures
        uses: EndBug/add-and-commit@v9
        with:
          add: "figures/*"
          message: "chore: update figures (auto)"
