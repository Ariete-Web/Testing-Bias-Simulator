name: Build brief PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "reports/brief.md"
      - ".github/workflows/build-brief.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert brief to PDF
        run: |
          pandoc reports/brief.md -o reports/brief.pdf

      - name: Commit PDF
        uses: EndBug/add-and-commit@v9
        with:
          add: "reports/brief.pdf"
          message: "chore: update brief PDF (auto)"
